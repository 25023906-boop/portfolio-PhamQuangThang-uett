  <style>
    :root {
      /* Đồng bộ phông chữ Comfortaa chuẩn chỉ 100% */
      --font-main: "Comfortaa", sans-serif;
      --accent: #00f2fe;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      overflow: hidden;
      height: 100vh;
    }

    /* =========================================
       PHÔNG NỀN CHUYỂN ĐỘNG
       ========================================= */
    .game-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Bầu trời chuyển màu hoàng hôn retro */
      background: linear-gradient(180deg, #0b132b 0%, #1c2541 40%, #3a506b 70%, #ff7e67 100%);
      z-index: 1;
      overflow: hidden;
    }

    /* Đám mây trôi */
    .cloud {
      position: absolute;
      fill: #ffffff;
      opacity: 0.8;
      animation: cloud-drift linear infinite;
      z-index: 3;
    }
    .c1 { top: 10%; width: 120px; animation-duration: 40s; opacity: 0.5; }
    .c2 { top: 25%; width: 200px; animation-duration: 25s; fill: #ffb3ba; }
    .c3 { top: 45%; width: 150px; animation-duration: 30s; fill: #fef08a; opacity: 0.6; }
    .c4 { top: 15%; width: 180px; animation-duration: 45s; animation-delay: -20s; opacity: 0.7; }
    .c5 { top: 35%; width: 100px; animation-duration: 35s; animation-delay: -10s; }

    @keyframes cloud-drift {
      0% { right: -300px; }
      100% { right: 110vw; }
    }

    /* Mặt đất di chuyển */
    .ground-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20%;
      background-color: #0a0a0a;
      border-top: 5px solid var(--accent);
      background-image: repeating-linear-gradient(90deg, #1a1a1a 0px, #1a1a1a 50px, #0a0a0a 50px, #0a0a0a 100px);
      z-index: 5;
      animation: track-move 1s linear infinite;
    }

    @keyframes track-move {
      from { background-position: 0 0; }
      to { background-position: -100px 0; }
    }

    /* KHỦNG LONG SIÊU TO MẬP, CHI TIẾT TỪNG PIXEL */
    .cute-dino-wrapper {
      position: absolute;
      bottom: 18%; /* Đứng vừa vặn trên vạch sáng của mặt đất */
      left: 10%;
      /* Tăng kích thước khổng lồ */
      width: 280px; 
      height: 280px;
      z-index: 6;
      /* Hiệu ứng dậm chân nảy lên nảy xuống */
      animation: dino-bounce 0.35s steps(2) infinite alternate;
    }

    @keyframes dino-bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-16px); }
    }

    /* =========================================
       GIAO DIỆN THẺ THÔNG TIN CHÍNH
       ========================================= */
    .glass-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      background: rgba(11, 19, 43, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; color: #fff; }

    nav a { 
      text-decoration: none; color: #fff; margin: 0 15px; 
      font-weight: 700; opacity: 0.7; transition: 0.3s; 
    }
    nav a:hover, nav a.active { opacity: 1; color: var(--accent); }

    .hero-section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.85); 
      padding: 60px 80px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 1);
      backdrop-filter: blur(20px);
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      transform: translateY(-5%); 
    }

    .hero-card h1 { font-size: 3.6rem; font-weight: 700; margin-bottom: 15px; color: #0b132b; }
    .hero-card h2 { font-size: 1.3rem; font-weight: 700; color: #475569; margin-bottom: 45px; }

    .btn-action {
      display: inline-block;
      text-decoration: none;
      padding: 16px 50px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #fff;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      transition: 0.3s;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
    }

    .btn-action:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 12px 30px rgba(0, 242, 254, 0.6); 
      color: #fff; 
    }

    @media (max-width: 768px) {
      .hero-card { padding: 40px 20px; background: rgba(255,255,255,0.9); }
      .hero-card h1 { font-size: 2.2rem; }
      .cute-dino-wrapper { left: 2%; width: 160px; height: 160px; }
      nav { display: none; }
    }
  </style>
</head>
